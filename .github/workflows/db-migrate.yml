name: Database Migration

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/drizzle/**'
      - 'apps/web/src/server/db/schema.ts'
      - '.github/workflows/db-migrate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-migrate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Validate database secret
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          if [ -z "$DIRECT_DATABASE_URL" ]; then
            echo "::error::Missing secret DIRECT_DATABASE_URL (direct, non-pooled Postgres connection string)."
            exit 1
          fi

      - name: Run Drizzle migrations
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: npm run db:migrate
        working-directory: apps/web

      - name: Verify schema
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          node --input-type=module -e "
            import postgres from 'postgres';
            const sql = postgres(process.env.DIRECT_DATABASE_URL, { max: 1, prepare: false });
            const rows = await sql\`select count(*)::int as tables from information_schema.tables where table_schema = 'public'\`;
            console.log('public tables:', rows[0].tables);
            await sql.end();
          "
        working-directory: apps/web
