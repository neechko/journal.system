name: Database Migration

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/drizzle/**'
      - 'apps/web/scripts/bootstrap-platform-operator.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-migrate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Install Supabase CLI
        run: npm install -g supabase@latest

      - name: Run migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Link to project (if not already linked)
          supabase link --project-ref dvkodbuzvtiunhdhatdl --password ${{ secrets.SUPABASE_DB_PASSWORD }}
          
          # Push migrations to production
          supabase db push --linked
        working-directory: apps/web

      - name: Verify migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Run a simple query to verify schema
          psql "$SUPABASE_DB_URL" -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public';"
        working-directory: apps/web