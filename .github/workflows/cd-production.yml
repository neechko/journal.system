name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-${{ github.workflow }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Lint
        run: npm run lint
        working-directory: apps/web

      - name: Type-check
        run: npm run typecheck
        working-directory: apps/web

      - name: Test
        run: npm test
        working-directory: apps/web

      - name: Build
        run: npm run build
        working-directory: apps/web

      - name: Verify confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "::error::Deployment confirmation required. Type 'deploy' to confirm."
            exit 1
          fi

      - name: Validate Vercel configuration
        run: |
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::Missing secret VERCEL_ORG_ID (expected team_...)."
            exit 1
          fi
          case "$VERCEL_ORG_ID" in
            team_*) ;;
            *)
              echo "::error::VERCEL_ORG_ID must start with 'team_'. The stored value is not a team id."
              exit 1
              ;;
          esac
          case "$VERCEL_PROJECT_ID" in
            prj_*) ;;
            *)
              echo "::error::VERCEL_PROJECT_ID must start with 'prj_'."
              exit 1
              ;;
          esac
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::Missing secret VERCEL_TOKEN."
            exit 1
          fi

      - name: Validate database migration connection
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          if [ -z "$DIRECT_DATABASE_URL" ]; then
            echo "::error::Missing secret DIRECT_DATABASE_URL."
            exit 1
          fi

      - name: Migrate database before deploying the app
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: npm run db:migrate
        working-directory: apps/web

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web

      - name: Deploy Project Artifacts to Vercel Production
        id: vercel-deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} | tail -1)
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"
        working-directory: apps/web

      - name: Verify deployment responds
        run: |
          url="${{ steps.vercel-deploy.outputs.deployment-url }}"
          echo "Checking $url"
          for attempt in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -L "$url" || true)
            echo "attempt $attempt -> HTTP $status"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Deployment did not return HTTP 200."
          exit 1

      - name: Notify deployment
        run: |
          echo "✅ Production deployed to ${{ steps.vercel-deploy.outputs.deployment-url }}"
